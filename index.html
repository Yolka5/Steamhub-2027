<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfbf9" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Steamhub" />
    <title>Steamhub</title>
    <meta name="description" content="Steamhub is the workshop hub of FRC team 1577 Steampunk: stock, manufacturing, prototypes, calendar, tools and the design handbook in one place." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Steamhub" />
    <meta property="og:title" content="Steamhub · FRC 1577" />
    <meta property="og:description" content="The workshop hub of FRC team 1577 Steampunk." />
    <meta property="og:image" content="https://steamhub1577.com/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
    <!-- Startup frame: shows before the app's code arrives, then React replaces it. -->
    <style>
      html { background: #fbfbf9; }
      html[data-theme='dark'] { background: #0c0c0c; }
      .boot { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
      .boot__logo { width: 72px; height: 72px; background: url('/logo-144.webp') center / contain no-repeat; }
      html[data-theme='dark'] .boot__logo { background-image: url('/logo-dark-144.webp'); }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-hidden="true"><span class="boot__logo"></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
